<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INTELLIGENCE // LIVE MAP</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body class="map-page"><header><div><div class="eyebrow">INTELLIGENCE // CONTROL</div><strong>LIVE LOCATION NETWORK</strong></div><div><span id="conn">AUTHENTICATING...</span> <button id="logout" class="secondary small">LOGOUT</button></div></header><main class="dash"><aside><div class="panel">OPERATORS <span id="count">0</span></div><div id="users"></div><div id="log" class="log"></div></aside><section><div id="map"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="config.js"></script><script>const {createClient}=supabase,client=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),map=L.map('map').setView([-7.8,110.37],8),markers=new Map;L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);function safe(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function render(r){const p=[Number(r.latitude),Number(r.longitude)];if(!markers.has(r.username)){markers.set(r.username,L.marker(p).addTo(map))}else markers.get(r.username).setLatLng(p);markers.get(r.username).bindPopup(`<b>${safe(r.username)}</b><br>${p[0].toFixed(6)}, ${p[1].toFixed(6)}<br>${new Date(r.last_updated).toLocaleString()}`)}async function load(){const {data,error}=await client.from('locations').select('*');if(error){conn.textContent='DATABASE ERROR';log.textContent=error.message;return}users.innerHTML='';data.forEach(render);count.textContent=data.length;data.forEach(r=>{const b=document.createElement('button');b.className='user';b.innerHTML=`● <b>${safe(r.username)}</b><small>${new Date(r.last_updated).toLocaleString()}</small>`;b.onclick=()=>{map.setView([r.latitude,r.longitude],16);markers.get(r.username).openPopup()};users.appendChild(b)});conn.textContent='● LIVE'}async function start(){const {data:{session}}=await client.auth.getSession();if(!session){location.href='admin-login.html';return}await load();client.channel('locations-live').on('postgres_changes',{event:'*',schema:'public',table:'locations'},load).subscribe(s=>{if(s==='SUBSCRIBED')conn.textContent='● LIVE'})}logout.onclick=async()=>{await client.auth.signOut();location.href='admin-login.html'};start();</script></body></html>
