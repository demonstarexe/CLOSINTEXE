<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INTELLIGENCE // LOCATION</title><link rel="stylesheet" href="style.css"></head><body><main class="center"><section class="card"><div class="eyebrow">INTELLIGENCE // FIELD NETWORK</div><h1>LOCATION ACCESS</h1><p id="welcome" class="muted"></p><div class="status"><span id="dot" class="dot"></span><span id="s">WAITING FOR CONSENT</span></div><p class="muted small">Your browser will ask for location permission. Choose YES only if you agree to share your current location.</p><div class="row"><button id="no" class="secondary">NO</button><button id="yes">YES, SHARE LOCATION</button></div><div id="log" class="log"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const {createClient}=supabase;const client=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const username=sessionStorage.getItem('intelligence_username');if(!username)location.href='index.html';welcome.textContent='OPERATOR: '+username;function status(t,c=''){s.textContent=t;dot.className='dot '+c}function log(t){const d=document.createElement('div');d.textContent=t;document.getElementById('log').prepend(d)}async function send(pos){const c=pos.coords;log(`GPS ${c.latitude.toFixed(6)}, ${c.longitude.toFixed(6)} // ±${Math.round(c.accuracy)}m`);status('SENDING LOCATION...','busy');const {error}=await client.rpc('set_location',{p_username:username,p_latitude:c.latitude,p_longitude:c.longitude,p_accuracy:c.accuracy});if(error){console.error(error);status('DATABASE ERROR','error');log(`ERROR ${error.code||''}: ${error.message}`);return}status('● LIVE LOCATION ACTIVE','live');log('LOCATION SENT SUCCESSFULLY')}function gpsErr(e){status('LOCATION ERROR','error');log(e.code===1?'Location permission was denied.':e.code===2?'Location unavailable.':'Location request timed out.')}let watch=null;yes.onclick=()=>{yes.disabled=true;no.disabled=true;if(!navigator.geolocation){status('GPS NOT SUPPORTED','error');return}status('REQUESTING GPS...','busy');watch=navigator.geolocation.watchPosition(send,gpsErr,{enableHighAccuracy:true,maximumAge:10000,timeout:20000})};no.onclick=()=>{if(watch!==null)navigator.geolocation.clearWatch(watch);yes.disabled=true;no.disabled=true;status('LOCATION NOT SHARED','error');log('User chose NO.')};</script></body></html>
