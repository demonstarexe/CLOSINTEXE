<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INTELLIGENCE // ACCESS</title><link rel="stylesheet" href="style.css"></head><body><main class="center"><section class="card"><div class="eyebrow">SIAKAD // UGM DEMO</div><h1>SIGN UP ACCESS</h1><p class="muted">Enter an name and new password to continue.</p><label>USERNAME</label><input id="u" autocomplete="username" maxlength="80" placeholder="Operator name"><label>PASSWORD</label><input id="p" type="password" autocomplete="current-password" placeholder="Password"><button id="go">SIGN UP</button><p id="m" class="message"></p><div class="notice">Please complete the registration form below to create your SIAKAD account.</div></section></main><script>function login(){const u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;if(!u||!p){m.textContent='Username and password are required.';return}sessionStorage.setItem('intelligence_username',u);location.href='location.html'}go.onclick=login;p.onkeydown=e=>{if(e.key==='Enter')login()};u.onkeydown=e=>{if(e.key==='Enter')p.focus()};</script></body></html>
