<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INTELLIGENCE // ADMIN</title><link rel="stylesheet" href="style.css"></head><body><main class="center"><section class="card"><div class="eyebrow">INTELLIGENCE // CONTROL</div><h1>ADMIN AUTHENTICATION</h1><p class="muted">Authorized dashboard access only.</p><label>EMAIL</label><input id="e" type="email" autocomplete="username"><label>PASSWORD</label><input id="p" type="password" autocomplete="current-password"><button id="go">AUTHENTICATE</button><p id="m" class="message"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const {createClient}=supabase,client=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);async function login(){m.textContent='Authenticating...';const {error}=await client.auth.signInWithPassword({email:e.value.trim(),password:p.value});if(error){m.textContent=error.message;return}location.href='admin.html'}go.onclick=login;p.onkeydown=x=>{if(x.key==='Enter')login()};</script></body></html>
